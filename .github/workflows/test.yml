name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test:
          - CoarseGrainedBankTest
          - FineGrainedBankTest
          - TreiberStackTest
          - TreiberStackWithEliminationTest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run ${{ matrix.test }}
        run: ./gradlew test --tests ${{ matrix.test }} --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.test }}
          path: build/reports/tests/test
